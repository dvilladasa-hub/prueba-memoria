<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Memoria</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }
        
        #app-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 800px;
            width: 90%;
            text-align: center;
        }
        
        #timer-bar-wrap {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        #timer-bar {
            height: 100%;
            background: #0071e3;
            width: 100%;
            transition: width 0.1s linear;
        }
        
        .stimulus-image {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .question-text {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 28px;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            max-width: 420px;
            margin: 0 auto 24px;
        }
        
        .option-btn {
            background: #f5f5f7;
            color: #333;
            border: 2px solid #ddd;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            margin-top: 0;
        }
        
        .option-btn:hover {
            border-color: #0071e3;
            background: #e8f0fe;
        }
        
        .option-btn.selected {
            border-color: #0071e3;
            background: #e8f0fe;
        }
        
        button.confirm-btn {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 13px 32px;
            font-size: 1.05rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        
        button.confirm-btn:hover {
            background-color: #005bb5;
        }
        
        button.confirm-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        
        select,
        input[type="number"],
        input[type="text"] {
            font-size: 1rem;
            padding: 10px 14px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            width: 100%;
            max-width: 400px;
            margin-bottom: 12px;
            background: #fff;
        }
        
        select:focus,
        input:focus {
            border-color: #0071e3;
        }
        
        .label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            display: block;
            text-align: left;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .radio-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 14px;
        }
        
        .radio-group label {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95rem;
        }
        
        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        
        th {
            background-color: #f9f9f9;
            font-weight: 600;
        }
        
        .correct {
            color: #2e7d32;
            font-weight: bold;
        }
        
        .incorrect {
            color: #c62828;
            font-weight: bold;
        }
        
        .meta-info {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 8px;
        }
        
        .phase-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: #e8f0fe;
            color: #1a56db;
            font-weight: 500;
            margin-bottom: 14px;
        }
        
        button {
            font-family: inherit;
        }
    </style>
</head>

<body>
    <div id="app-container">
        <h2>Bienvenido/a a la Prueba de Memoria</h2>
        <p>Se mostrará una imagen por un tiempo limitado. Luego responderás 4 preguntas sobre lo que viste.</p>
        <p>Una vez iniciada la prueba, <strong>no podrás volver atrás</strong>.</p>
        <br>

        <label class="label">Grupo de edad</label>
        <select id="group-select">
        <option value="">Selecciona tu grupo...</option>
        <option value="G0_ninez">Niñez (0–11 años)</option>
        <option value="G1_adolescencia">Adolescencia (12–17 años)</option>
        <option value="G2_juventud">Juventud (18–28 años)</option>
        <option value="G3_adulto">Adulto (29–59 años)</option>
        <option value="G4_adulto_mayor">Adulto mayor (60 años o más)</option>
    </select>

        <label class="label">Género</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="Hombre"> Hombre</label>
            <label><input type="radio" name="gender" value="Mujer"> Mujer</label>
        </div>

        <button class="confirm-btn" onclick="startExperiment()">Iniciar prueba</button>
        <p class="meta-info">Grupos según clasificación del DANE</p>
    </div>

    <script>
        // ── CONFIGURACIÓN ─────────────────────────────────────────────────────────
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz85L4-qcf7n01Lci46RR3XONB_gfZOIatcMphttCPKcp0JnSFlnyBXf63XHheSBNh4/exec';

        // ── ESTÍMULO Y PREGUNTAS ──────────────────────────────────────────────────
        // La imagen debe llamarse imagen1.jpg y estar en la misma carpeta que este archivo.
        const STIMULUS_IMAGE = 'imagen1.jpg';
        const STIMULUS_DURATION = 15000; // 15 segundos

        // Exactamente 4 preguntas de selección múltiple
        const questions = [{
            text: '¿Cuántos rectángulos morados hay en la imagen?',
            options: ['0', '1', '2', '3'],
            answer: '1'
        }, {
            text: '¿Cuántos cuadrados hay en la imagen?',
            options: ['4', '5', '6', '7'],
            answer: '5'
        }, {
            text: '¿Cuántos círculos hay en la imagen?',
            options: ['5', '6', '7', '8'],
            answer: '6'
        }, {
            text: '¿Cuántos rombos hay en la imagen?',
            options: ['0', '1', '2', '3'],
            answer: '0'
        }];
        // Verificación: debe ser 4

        // ── ESTADO ────────────────────────────────────────────────────────────────
        var questionIndex = 0;
        var questionStartTime = 0;
        var timerInterval = null;
        var selectedOption = null;

        // Datos del participante
        var participantGroup = '';
        var participantGender = '';

        // Acumuladores de resultados (longitud final: 4)
        var results = [];

        const container = document.getElementById('app-container');

        // ── BLOQUEO NAVEGACIÓN ────────────────────────────────────────────────────
        function lockBackButton() {
            history.pushState(null, '', location.href);
            window.onpopstate = function() {
                history.pushState(null, '', location.href);
            };
        }

        // ── INICIO ────────────────────────────────────────────────────────────────
        function startExperiment() {
            const groupVal = document.getElementById('group-select').value;
            const genderEl = document.querySelector('input[name="gender"]:checked');

            if (!groupVal) {
                alert('Por favor selecciona el grupo de edad.');
                return;
            }
            if (!genderEl) {
                alert('Por favor selecciona el género.');
                return;
            }

            participantGroup = groupVal;
            participantGender = genderEl.value;

            lockBackButton();
            showStimulus();
        }

        // ── ESTÍMULO ──────────────────────────────────────────────────────────────
        function showStimulus() {
            let elapsed = 0;
            const totalMs = STIMULUS_DURATION;

            container.innerHTML =
                `<div class="phase-badge">Observa la imagen</div>
             <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
             <img src="${STIMULUS_IMAGE}" alt="Estímulo visual" class="stimulus-image"
                  onerror="this.outerHTML='<p style=color:#c62828>⚠ No se encontró <strong>${STIMULUS_IMAGE}</strong>. Asegúrate de que esté en la misma carpeta que este archivo.</p>'">`;

            timerInterval = setInterval(() => {
                elapsed += 100;
                const pct = Math.max(0, 100 - (elapsed / totalMs * 100));
                const bar = document.getElementById('timer-bar');
                if (bar) bar.style.width = pct + '%';
                if (elapsed >= totalMs) {
                    clearInterval(timerInterval);
                    questionIndex = 0;
                    showQuestion();
                }
            }, 100);
        }

        // ── PREGUNTA ──────────────────────────────────────────────────────────────
        // Mezcla un array en orden aleatorio (algoritmo Fisher-Yates)
        function shuffle(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = a[i];
                a[i] = a[j];
                a[j] = tmp;
            }
            return a;
        }

        function showQuestion() {
            if (questionIndex >= questions.length) {
                showSummary();
                return;
            }

            selectedOption = null;
            questionStartTime = performance.now();
            const q = questions[questionIndex];

            const optionsHtml = shuffle(q.options).map(op =>
                `<button class="option-btn" onclick="selectOption(this, '${op}')">${op}</button>`
            ).join('');

            container.innerHTML =
                `<div class="phase-badge">Pregunta ${questionIndex + 1} de ${questions.length}</div>
             <div class="question-text">${q.text}</div>
             <div class="options-grid">${optionsHtml}</div>
             <button class="confirm-btn" id="confirm-btn" onclick="confirmAnswer()" disabled>Confirmar →</button>`;
        }

        function selectOption(btn, value) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedOption = value;
            document.getElementById('confirm-btn').disabled = false;
        }

        function confirmAnswer() {
            if (!selectedOption) return;

            const q = questions[questionIndex];
            const timeElapsed = ((performance.now() - questionStartTime) / 1000).toFixed(2);
            const isCorrect = selectedOption === q.answer;

            results.push({
                pregunta: q.text,
                respuesta_usuario: selectedOption,
                es_correcta: isCorrect,
                tiempo_segundos: parseFloat(timeElapsed)
            });

            questionIndex++;
            showQuestion();
        }

        // ── RESUMEN FINAL ─────────────────────────────────────────────────────────
        function showSummary() {
            // Verificaciones de integridad

            const correctas = results.filter(r => r.es_correcta).length;

            const rows = results.map((r, i) => {
                const cls = r.es_correcta ? 'correct' : 'incorrect';
                const txt = r.es_correcta ? 'Sí ✓' : 'No ✗';
                const q = r.pregunta.length > 55 ? r.pregunta.slice(0, 52) + '…' : r.pregunta;
                return `<tr>
                <td style="text-align:left">${q}</td>
                <td>${r.respuesta_usuario}</td>
                <td class="${cls}">${txt}</td>
                <td>${r.tiempo_segundos}</td>
            </tr>`;
            }).join('');

            var tiempoTotal = results.reduce((a, r) => a + Number(r.tiempo_segundos), 0).toFixed(2);
            var grupoLabel = document.querySelector('#group-select option:checked').text;
            var generoLabel = participantGender;

            container.innerHTML =
                `<h2>Prueba finalizada</h2>
             <p>Gracias por tu participación.</p>
             <p><strong>Grupo:</strong> ${grupoLabel} &nbsp;|&nbsp; <strong>Género:</strong> ${generoLabel}</p>
             <p><strong>${correctas} de ${results.length}</strong> respuestas correctas.</p>
             <table>
                 <thead>
                     <tr>
                         <th style="text-align:left">Pregunta</th>
                         <th>Tu respuesta</th>
                         <th>¿Correcta?</th>
                         <th>Tiempo (s)</th>
                     </tr>
                 </thead>
                 <tbody>${rows}</tbody>
             </table>
            <p style="margin-top:16px; color:#555;">
                <strong>Tiempo total:</strong> ${tiempoTotal} segundos
            </p>
`;

            // Envío único a Google Sheets con todos los datos al finalizar
            // Timestamp | Grupo | Genero | Rpta_P1 | Rpta_P2 | Rpta_P3 | Rpta_P4 | t1 | t2 | t3 | t4
            const payload = {
                grupo: participantGroup,
                genero: participantGender,
                respuestas: results.map(r => r.respuesta_usuario),
                tiempos: results.map(r => Number(r.tiempo_segundos))
            };

            console.log('Enviando a Apps Script:', payload);
            fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    console.log('Petición enviada');
                    var p = document.createElement('p');
                    p.style.color = '#2e7d32';
                    p.style.fontWeight = 'bold';
                    p.style.marginTop = '20px';
                    p.textContent = '✓ Respuestas registradas correctamente.';
                    container.appendChild(p);
                })
                .catch(err => console.error('Error enviando datos:', err));
        }
    </script>
</body>

</html>
